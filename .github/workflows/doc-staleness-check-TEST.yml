              $MermaidSkillInstructions = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($MermaidSkillBase64)) -split "`r?`n"

              $PromptLines = @(
                  $DiataxisAgentInstructions,
                  "",
                  "## mermaid-diagrams skill",
                  "",
                  $MermaidSkillInstructions,
                  "",
                  "## Important overrides for this task",
                  "- This is a non-interactive, unattended batch job - there is no user to ask. Ignore 'Step 1: Clarify User Intent', 'If user is uncertain, ask clarifying questions', 'Ambiguous scope', and 'When to Ask for Clarification' - make the best reasonable judgment call instead and proceed directly to writing the document.",
                  "- Skip Step 5 items 2-4 and the Communication Style guidance about explaining your reasoning or asking the user - output ONLY the raw markdown document, no commentary, questions, or companion-doc recommendations.",
                  "- The `mermaid-diagrams` skill is available (included above as '## mermaid-diagrams skill') - follow its Diagrams guidance exactly if a diagram would help; its `references/*.md` deep-dive links are not available in this environment, so rely only on the rules stated inline above.",
                  "",
                  "$DocContext",
                  "",
                  "Follow the Diataxis framework with these four sections, in this order:",
                  "1. Tutorials - a step-by-step walkthrough for a first-time user to get the workflow running end-to-end",
                  "2. How-to guides - step-by-step instructions for common tasks",
                  "3. Reference - triggers, secrets, tickers/instruments table, output fields, API/data sources",
                  "4. Explanation - design decisions and reasoning",
                  "",
                  "Rules:",
                  "- The document must start with: '# Workflow documentation: <Workflow Display Name>'",
                  "- Line 2 must be exactly: **Workflow file:** [.github/workflows/$WorkflowName.yml](../../.github/workflows/$WorkflowName.yml)",
                  "- Line 3 must be exactly: **Last reviewed date:** $Today",
                  "- After line 3, add a '## Intro' section with a 2-3 sentence summary explaining what the workflow does and why it exists",
                  "- Use markdown tables for all lists of items (triggers, secrets, fields, tickers, etc.)",
                  "- Create/update all Reference tables to exactly match the current workflow file",
                  "- Do not add commentary or preamble - output only the raw markdown document",
                  "",
                  "## Current workflow file ($WorkflowFile)",
                  "",
                  '```yaml',
                  $WorkflowContent,
                  '```',
                  "",
                  "## Current documentation ($DocFile)",
                  "",
                  $CurrentDoc,
                  "",
                  "## Recent commits to the workflow since the doc was last updated",
                  "",
                  $CommitList
              )
              $Prompt = $PromptLines -join "`n"

              $RequestBody = @{
                  model    = "gemini-3.5-flash-lite"
                  messages = @(
                      @{ role = "user"; content = $Prompt }
                  )
                  max_tokens = 4096
              } | ConvertTo-Json -Depth 10

              # Gemini occasionally returns 503 (overloaded) - retry with a fixed delay.
              # 429 means the daily quota is exhausted, so retrying won't help - skip this doc instead.
              $MaxAttempts = 10
              $RetryDelaySeconds = 5
              $Response = $null
              for ($Attempt = 1; $Attempt -le $MaxAttempts; $Attempt++) {
                  try {
                      $Response = Invoke-RestMethod `
                          -Uri     "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" `
                          -Method  Post `
                          -Headers @{
                              "Authorization" = "Bearer $env:GEMINI_API_KEY"
                              "Content-Type"  = "application/json"
                          } `
                          -Body $RequestBody `
                          -ErrorAction Stop
                      break
                  } catch {
                      $StatusCode = $_.Exception.Response.StatusCode.value__
                      if ($StatusCode -eq 429) {
                          Write-Host "  Gemini API quota exhausted (429), skipping $DocFile for this run."
                          break
                      } elseif ($StatusCode -in 500, 503 -and $Attempt -lt $MaxAttempts) {
                          Write-Host "  Gemini API returned $StatusCode, retrying in $RetryDelaySeconds s (attempt $Attempt/$MaxAttempts)..."
                          Start-Sleep -Seconds $RetryDelaySeconds
                      } else {
                          throw
                      }
                  }
              }

              if (-not $Response) { continue }

              $NewDocContent = $Response.choices[0].message.content

              # Strip code fence wrapper if the AI returned ```markdown ... ```
              $NewDocContent = $NewDocContent -replace '^```[a-z]*\r?\n', '' -replace '\r?\n```\s*$', ''

              # Create/refresh branch, commit, open PR (or comment on the existing one)
              $DocExists  = Test-Path $DocFile
              $Action     = if ($DocExists) { "update" } else { "create" }
              $CommitMsg  = if ($ExistingPR) { "docs: refresh $DocFile (workflow changed since this PR was last updated)" } elseif ($DocExists) { "docs: auto-update $DocFile (workflow changed since last doc edit)" } else { "docs: create $DocFile" }
              $PRTitle    = if ($DocExists) { "📝 Doc update: $WorkflowName" } else { "📝 New doc: $WorkflowName" }

              if ($ExistingPR) {
                  git checkout -B $BranchName "origin/$BranchName"
              } else {
                  git checkout main
                  git checkout -b $BranchName
              }

              $null = New-Item -ItemType Directory -Force -Path (Split-Path $DocFile)
              Set-Content -Path $DocFile -Value $NewDocContent -NoNewline
              git add $DocFile
              git commit -m $CommitMsg
              git push origin $BranchName

              if ($ExistingPR) {
                  $CommentBodyLines = @(
                      "🔄 Documentation regenerated - the workflow changed since this PR was last updated.",
                      "",
                      "| | Date |",
                      "|---|---|",
                      "| Workflow last changed | $WorkflowDate |",
                      "",
                      "## Workflow commits since last doc update",
                      "",
                      $CommitList
                  )
                  $CommentBody = $CommentBodyLines -join "`n"

                  gh pr comment $ExistingPR.number --repo $env:REPO --body $CommentBody

                  Write-Host "  PR #$($ExistingPR.number) refreshed for $DocFile"
              } else {
                  $PRBodyLines = @(
                      $(if ($DocExists) {
                          "This PR was automatically generated because ``$WorkflowFile`` was modified after the documentation was last updated."
                      } else {
                          "This PR was automatically generated because ``$WorkflowFile`` exists but has no documentation yet."
                      }),
                      "",
                      "| | Date |",
                      "|---|---|",
                      "| Workflow last changed | $WorkflowDate |",
                      "| Doc last changed | $(if ($DocDate) { $DocDate } else { 'never' }) |",
                      "",
                      "Please review the $Action`d documentation for accuracy, then merge or request changes.",
                      "",
                      "## Workflow commits since last doc update",
                      "",
                      $CommitList
                  )
                  $PRBody = $PRBodyLines -join "`n"

                  gh pr create `
                      --repo  $env:REPO `
                      --title $PRTitle `
                      --body  $PRBody `
                      --base  main `
                      --head  $BranchName `
                      --label "documentation"

                  Write-Host "  PR created for $DocFile"
              }
          }

