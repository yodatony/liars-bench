name: doc-staleness-check

on:
  workflow_dispatch:
  schedule:
    - cron: '55 2 1 * *'   # 1st of every month at 02:55 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check staleness and rewrite docs via Gemini
        shell: pwsh
        env:
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO:           ${{ github.repository }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $OpenPRs = gh pr list --repo $env:REPO --state open --json headRefName | ConvertFrom-Json

          $WorkflowFiles = Get-ChildItem ".github/workflows/*.yml"

          foreach ($WfFile in $WorkflowFiles) {
              $WorkflowFile = $WfFile.FullName.Replace($PWD.Path + [System.IO.Path]::DirectorySeparatorChar, "").Replace("\", "/")
              $WorkflowName = $WfFile.BaseName
              $DocFile      = "docs/workflows/$WorkflowName.md"

              Write-Host "Checking: $WorkflowFile"

              # Get the last commit date for the workflow and the doc
              $WorkflowDate = git log -1 --format="%ci" -- $WorkflowFile 2>$null
              $DocDate      = git log -1 --format="%ci" -- $DocFile      2>$null

              if (-not $WorkflowDate) {
                  Write-Host "  No commits found for workflow, skipping."
                  continue
              }

              # If the doc has never been committed, or workflow is newer than doc -> stale
              $IsStale = (-not $DocDate) -or ([datetime]$WorkflowDate -gt [datetime]$DocDate)
              Write-Host "  Workflow last changed: $WorkflowDate"
              Write-Host "  Doc last changed:      $(if ($DocDate) { $DocDate } else { 'never' })"
              Write-Host "  Stale: $IsStale"

              if (-not $IsStale) { continue }

              # Check if an open PR already exists for this doc
              if ($OpenPRs | Where-Object { $_.headRefName -like "doc-update/$WorkflowName*" }) {
                  Write-Host "  Open PR already exists, skipping."
                  continue
              }

              $BranchName = "doc-update/$WorkflowName-$(Get-Date -Format 'yyyyMMdd')"

              # Read current files
              $WorkflowContent = Get-Content $WorkflowFile -Raw
              $CurrentDoc      = if (Test-Path $DocFile) { Get-Content $DocFile -Raw } else { "" }
              $Today           = (Get-Date -Format 'yyyy-MM-dd')

              # Recent commits to the workflow since the doc was last updated
              $CommitLines = if ($DocDate) {
                  git log --oneline --after="$DocDate" -- $WorkflowFile 2>$null
              } else {
                  git log --oneline -- $WorkflowFile 2>$null
              }
              $CommitList = ($CommitLines | Where-Object { $_ -ne "" }) -join "`n"

              # Call Gemini's free, OpenAI-compatible API (GitHub Models was retired 2026-07-30)
              $DocContext = if ($CurrentDoc) {
                  "You are updating an existing documentation file. Preserve all existing Explanation and How-to content unless the workflow makes it incorrect."
              } else {
                  "You are creating a new documentation file from scratch. Write complete Explanation and How-to sections based on the workflow."
              }
              $PromptLines = @(
                  "You are a technical writer. $DocContext",
                  "",
                  "Follow the Diataxis framework with these four sections:",
                  "1. Reference - triggers, secrets, tickers/instruments table, output fields, API/data sources",
                  "2. How-to guides - step-by-step instructions for common tasks",
                  "3. Explanation - design decisions and reasoning",
                  "",
                  "Rules:",
                  "- The document must start with: '# Workflow documentation: <Workflow Display Name>'",
                  "- Line 2 must be exactly: **Workflow file:** [.github/workflows/$WorkflowName.yml](../../.github/workflows/$WorkflowName.yml)",
                  "- Line 3 must be exactly: **Last reviewed date:** $Today",
                  "- Use markdown tables for all lists of items (triggers, secrets, fields, tickers, etc.)",
                  "- Create/update all Reference tables to exactly match the current workflow file",
                  "- Do not add commentary or preamble - output only the raw markdown document",
                  "",
                  "## Current workflow file ($WorkflowFile)",
                  "",
                  '```yaml',
                  $WorkflowContent,
                  '```',
                  "",
                  "## Current documentation ($DocFile)",
                  "",
                  $CurrentDoc,
                  "",
                  "## Recent commits to the workflow since the doc was last updated",
                  "",
                  $CommitList
              )
              $Prompt = $PromptLines -join "`n"

              $RequestBody = @{
                  model    = "gemini-3.5-flash-lite"
                  messages = @(
                      @{ role = "user"; content = $Prompt }
                  )
                  max_tokens = 4096
              } | ConvertTo-Json -Depth 10

              # Gemini occasionally returns 503 (overloaded) - retry with a fixed delay.
              # 429 means the daily quota is exhausted, so retrying won't help - skip this doc instead.
              $MaxAttempts = 10
              $RetryDelaySeconds = 5
              $Response = $null
              for ($Attempt = 1; $Attempt -le $MaxAttempts; $Attempt++) {
                  try {
                      $Response = Invoke-RestMethod `
                          -Uri     "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" `
                          -Method  Post `
                          -Headers @{
                              "Authorization" = "Bearer $env:GEMINI_API_KEY"
                              "Content-Type"  = "application/json"
                          } `
                          -Body $RequestBody `
                          -ErrorAction Stop
                      break
                  } catch {
                      $StatusCode = $_.Exception.Response.StatusCode.value__
                      if ($StatusCode -eq 429) {
                          Write-Host "  Gemini API quota exhausted (429), skipping $DocFile for this run."
                          break
                      } elseif ($StatusCode -in 500, 503 -and $Attempt -lt $MaxAttempts) {
                          Write-Host "  Gemini API returned $StatusCode, retrying in $RetryDelaySeconds s (attempt $Attempt/$MaxAttempts)..."
                          Start-Sleep -Seconds $RetryDelaySeconds
                      } else {
                          throw
                      }
                  }
              }

              if (-not $Response) { continue }

              $NewDocContent = $Response.choices[0].message.content

              # Strip code fence wrapper if the AI returned ```markdown ... ```
              $NewDocContent = $NewDocContent -replace '^```[a-z]*\r?\n', '' -replace '\r?\n```\s*$', ''

              # Create branch, commit, open PR
              $DocExists  = Test-Path $DocFile
              $Action     = if ($DocExists) { "update" } else { "create" }
              $CommitMsg  = if ($DocExists) { "docs: auto-update $DocFile (workflow changed since last doc edit)" } else { "docs: create $DocFile" }
              $PRTitle    = if ($DocExists) { "📝 Doc update: $WorkflowName" } else { "📝 New doc: $WorkflowName" }

              git checkout main
              git checkout -b $BranchName

              $null = New-Item -ItemType Directory -Force -Path (Split-Path $DocFile)
              Set-Content -Path $DocFile -Value $NewDocContent -NoNewline
              git add $DocFile
              git commit -m $CommitMsg
              git push origin $BranchName

              $PRBodyLines = @(
                  $(if ($DocExists) {
                      "This PR was automatically generated because ``$WorkflowFile`` was modified after the documentation was last updated."
                  } else {
                      "This PR was automatically generated because ``$WorkflowFile`` exists but has no documentation yet."
                  }),
                  "",
                  "| | Date |",
                  "|---|---|",
                  "| Workflow last changed | $WorkflowDate |",
                  "| Doc last changed | $(if ($DocDate) { $DocDate } else { 'never' }) |",
                  "",
                  "Please review the $Action`d documentation for accuracy, then merge or request changes.",
                  "",
                  "## Workflow commits since last doc update",
                  "",
                  $CommitList
              )
              $PRBody = $PRBodyLines -join "`n"

              gh pr create `
                  --repo  $env:REPO `
                  --title $PRTitle `
                  --body  $PRBody `
                  --base  main `
                  --head  $BranchName `
                  --label "documentation"

              Write-Host "  PR created for $DocFile"
          }

